<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container"> <!-- outer container-->
        <h1>Kanban Board</h1>
        <div class="board"> <!-- board-->
            <!-- LIST 1-->
             <div class="list" id="list1">
                <h2>To Do</h2>
                <div class="card" id="card1" draggable="true">Wash Dishes</div>
                <div class="card" id="card2" draggable="true">Code Laboratory</div>
                <div class="card" id="card3" draggable="true">Go Home</div>
                <div class="card" id="card4" draggable="true">Ride Vehicle</div>
             </div>
             <!-- LIST 2-->
             <div class="list" id="list2">
                <h2>In Progress</h2>
                <div class="card" id="card5" draggable="true">To Learn</div>
             </div>
             <!-- LIST 3-->
             <div class="list" id="list3">
                <h2>Done</h2>
             </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
