<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container"> <!-- outer container-->
        <h1>Kanban Board</h1>

        <!-- SEARCH BAR (added) -->
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search tasks or categories...">
        </div>

        <div class="board"> <!-- board-->
            <!-- LIST 1-->
            <div class="list" id="list1">
                <h2>To Do</h2>
                <!-- Task controls for this list -->
                <button class="add-task-btn" type="button">+ Add Task</button>
                <form class="task-form hidden">
                    <input type="text" name="title" placeholder="Task title" required>
                    <input type="text" name="category" placeholder="Category (optional)">
                    <div class="form-actions">
                        <button type="submit">Add</button>
                        <button type="button" class="cancel-btn">Cancel</button>
                    </div>
                </form>
                <!-- Container that holds task cards -->
                <div class="cards"></div>
            </div>
            <!-- LIST 2-->
            <div class="list" id="list2">
                <h2>In Progress</h2>
                <!-- Task controls for this list -->
                <button class="add-task-btn" type="button">+ Add Task</button>
                <form class="task-form hidden">
                    <input type="text" name="title" placeholder="Task title" required>
                    <input type="text" name="category" placeholder="Category (optional)">
                    <div class="form-actions">
                        <button type="submit">Add</button>
                        <button type="button" class="cancel-btn">Cancel</button>
                    </div>
                </form>
                <!-- Container that holds task cards -->
                <div class="cards"></div>
            </div>
            <!-- LIST 3-->
            <div class="list" id="list3">
                <h2>Done</h2>
                <!-- Task controls for this list -->
                <button class="add-task-btn" type="button">+ Add Task</button>
                <form class="task-form hidden">
                    <input type="text" name="title" placeholder="Task title" required>
                    <input type="text" name="category" placeholder="Category (optional)">
                    <div class="form-actions">
                        <button type="submit">Add</button>
                        <button type="button" class="cancel-btn">Cancel</button>
                    </div>
                </form>
                <!-- Container that holds task cards -->
                <div class="cards"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
